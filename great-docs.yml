# Great Docs Configuration for DASCore
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# This replaces the previous custom doc build (scripts/build_api_docs.py,
# scripts/_index_api.py, scripts/_render_api.py, scripts/_qmd_builder.py,
# scripts/_validate_links.py, and docs/filters/fill_links.py).

display_name: DASCore

# Docstring format used throughout the package.
parser: numpy

# Runtime introspection (needed so @compose_docstring-templated docstrings
# render with their substitutions filled in).
dynamic: true

site_url: "https://dascore.org"
repo: "https://github.com/DASDAE/dascore"

logo:
  light: assets/logo.png
  dark: assets/logo.png
  alt: "DASCore logo"
  show_title: true

# Pre-render hook: add alias entries (Patch methods, re-export paths,
# module links) to the interlink inventory so alias-style cross references
# keep resolving.
pre_render: scripts/greatdocs_alias_inventory.py

# Branding: colors derived from the DASCore logo (navy #002868,
# red #D0002A, gold #FFC934).
accent_color:
  light: "#00306E"
  dark: "#8FB4F2"

# Solid navy navbar (text color is auto-picked for contrast).
navbar_color:
  light: "#002868"
  dark: "#0B1730"

# Lucide icons for the top navigation.
nav_icons:
  navbar:
    Tutorial: graduation-cap
    Recipes: chef-hat
    Notes: notebook-pen
    Contributing: git-pull-request
    About: info
    Reference: library
    Changelog: history

# Small brand stylesheet: gold keyline under the navbar, navy headings,
# slightly softened code blocks.
include_in_header:
  - text: |
      <style>
      .navbar { border-bottom: 3px solid #FFC934; }
      h1, h2, h3 { letter-spacing: -0.01em; }
      h1, h2 { color: #002868; }
      h2 { border-bottom: 1px solid rgba(0, 40, 104, 0.15); padding-bottom: 0.3rem; }
      .quarto-dark h1, .quarto-dark h2 { color: #AFC8F5; }
      .quarto-dark h2 { border-bottom-color: rgba(175, 200, 245, 0.2); }
      div.sourceCode, pre.sourceCode {
        border: 1px solid rgba(0, 40, 104, 0.12);
        border-radius: 8px;
      }
      .quarto-dark div.sourceCode, .quarto-dark pre.sourceCode {
        border-color: rgba(175, 200, 245, 0.15);
      }
      .gd-hero { padding-top: 1.5rem; }
      .navbar .navbar-title { max-width: none; }
      .navbar .navbar-brand-container { flex-shrink: 0; }
      body:has(.gd-hero) main > header#title-block-header h1.title { display: none; }
      .sidebar nav[role="doc-toc"] a.active { font-weight: 600; }
      </style>

# Bibliography so citations (e.g. @lindsey2020broadband) in docstrings and
# narrative pages resolve instead of hanging pandoc.
bibliography: docs/references.bib

authors:
  - name: The DASDAE contributors
    role: Author
    github: DASDAE

# Narrative documentation. Each section becomes a top-level site directory
# matching the old site layout, so existing relative links keep working.
sections:
  - title: Tutorial
    dir: tutorial
  - title: Recipes
    dir: recipes
    index: true
  - title: Notes
    dir: notes
    index: true
  - title: Contributing
    dir: contributing
    index: true
  - title: About
    dir: about
    index: true

# Names picked up by discovery that are implementation details or
# accidental re-exports (dascore modules do not define __all__).
exclude:
  - clients
  - warnings
  - compat.MATERIALIZE_NOW
  - compat.random_state
  - examples.compose_docstring
  - examples.fetch
  - examples.iterate
  - examples.get_patch_names
  - examples.random_state
  - examples.register_func
  - examples.EXAMPLE_PATCHES
  - examples.EXAMPLE_SPOOLS
  - examples.UnknownExampleError
  - io.PatchNameSpace
  - proc.ArrayLike
  - proc.PatchType
  - proc.apply_operator
  - proc.array
  - proc.compose_docstring
  - proc.get_parent_code_name
  - proc.get_dim_axis_value
  - proc.iterate
  - proc.select_values_description
  - proc.CoordError
  - proc.ParameterError
  - proc.PatchCoordinateError
  - proc.PatchError
  - units.assert_dtype_compatible_with_units
  - units.dtype_time_like
  - units.is_array
  - units.is_datetime64
  - units.is_timedelta64
  - units.iterate
  - units.maybe_convert_percent_to_fraction
  - units.numeric
  - units.quant_sequence_to_quant_array
  - units.str_or_none
  - units.unbyte
  - units.UnitError
  - viz.PatchNameSpace

# Curated API reference. Grouped by task, mirroring how the tutorial
# introduces the library.
reference:
  - title: Getting Data In and Out
    desc: Read, scan, and write fiber-optic sensing data files
    contents:
      - spool
      - read
      - scan
      - scan_to_df
      - write
      - get_format

  - title: Core Classes
    desc: The central data structures of DASCore
    contents:
      - name: Patch
        members: [data, coords, dims, attrs, shape, size, ndim, dtype, seconds, channel_count, coord_shapes, assign_coords, get_patch_name, iresample, iselect, tran, T]
      - name: BaseSpool
        members: [chunk, concatenate, get_contents, get_patch_names, map, select, sort, split, update, viz]
      - clients.dirspool.DirectorySpool
      - name: PatchAttrs
        members: [coords_from_dims, dim_tuple, drop, drop_private, flat_dump, from_dict, get, get_summary_df, items, parse_coord_attributes, rename_dimension, update]
      - name: CoordManager
        members: [convert_units, coord_range, coord_shapes, coord_size, decimate, dim_to_coord_map, disassociate_coord, drop_coords, drop_disassociated_coords, drop_private_coords, equals, flip, get_array, get_axis, get_coord, get_coord_tuple_map, keys, make_broadcastable_to, max, min, ndim, new, order, rename_coord, select, set_dims, set_units, shape, simplify_units, size, snap, sort, squeeze, step, to_summary_dict, transpose, update, update_from_attrs, validate_data]
