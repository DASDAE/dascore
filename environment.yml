name: dascore
channels:
  - conda-forge
# Every dependency dascore requires belongs here: the conda_env job installs
# dascore with --no-deps and runs pip check, so a package missing from this
# file fails that job rather than being quietly filled in from PyPI.
dependencies:
  - python>=3.12
  - pytest
  - pytest-timeout
  - array-api-compat>=1.9
  - numpy>=2.3.3
  - packaging
  - pydantic>2.1
  - pip
  - pandas>=3.0
  - pooch>=1.3
  - pyyaml
  - rich
  - universal_pathlib
  - xarray
  - pre-commit
  - h5py
  - matplotlib>=3.10
  - scipy>=1.15.0
  - findiff
  - pyarrow
  - jupyter
  - nbformat
  - pint>=0.24.4
  - typing_extensions>=4.12
