# Lint the code using the defined pre-commits
name: LintCode
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint_code:
    runs-on: ubuntu-latest

    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}

      - name: install linting packages
        run: uv tool install pre-commit

      - name: run all precommits
        run: uv tool run pre-commit run --all
