# Proposed replacement for the doc-build workflows using great-docs.
# One command (great-docs build) replaces scripts/build_api_docs.py +
# quarto render, and the output additionally contains llms.txt,
# llms-full.txt, per-page markdown, SKILL.md and .well-known/agent-skills.
#
# NOTE (prototype): kept alongside the old workflows for comparison; a real
# migration would fold this into build_deploy_master_docs.yaml,
# build_deploy_stable_docs.yaml and test_doc_build.yml.

name: BuildDocsGreatDocs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: "0"

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          version: 1.8.27

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dascore and great-docs
        run: |
          # docs: doc-build helpers; test: pytest (used by some notes pages);
          # extras: optional format/processing deps imported by example cells
          # (findiff, xarray, obspy, ...).
          # great-docs >=0.16 renders class signatures with their parameters
          # and points See Also links at the pages the reference actually
          # generates; earlier versions emit broken links.
          python -m pip install -e ".[docs,test,extras]" "great-docs>=0.16"

      - name: Prepare test data
        run: |
          python scripts/modify_h5_file.py || true

      - name: Build documentation
        run: |
          great-docs build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation
          path: ./great-docs/_site
          # .well-known/agent-skills must survive packaging
          include-hidden-files: true
          retention-days: 7

      # Deployment: `quarto publish` no longer applies; push great-docs/_site
      # with the netlify CLI instead, e.g.:
      #   npx netlify-cli deploy --prod --dir great-docs/_site
      # or use great-docs setup-github-pages for a Pages deployment.
