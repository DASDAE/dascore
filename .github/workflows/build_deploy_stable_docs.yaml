# Create documentation for stable (latest version) and deploy
name: BuildDeployStableDocs

on:
  # Runs when publishing a new release
  release:
    types: [ published ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Write permissions are granted per job below; the default is read-only.
permissions:
  contents: read

# Allow one concurrent deployment. Only runs which can deploy need to
# serialize, so they share the "pages" group with the master docs workflow.
# A pre-release never deploys; it is grouped per tag so that publishing one
# pre-release cannot cancel another's build before it attaches docs.zip.
concurrency:
  group: >-
    ${{ github.event.release.prerelease
    && format('pages-prerelease-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload docs.zip to the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - name: Set manual stable docs version
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Manually set DASCore version based on the last stable tag.
          # Match only final releases: git's version sort places a
          # pre-release (v0.2.0b1) above its final (v0.2.0), so an
          # unfiltered list would publish beta docs as stable.
          tag="$(git tag --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::error::No stable release tag matching vX.Y.Z exists."
            exit 1
          fi
          echo "DASCORE_DOC_VERSION=${tag#v}" >> "$GITHUB_ENV"

          # Keep workflow actions and docs build scripts from this checkout,
          # but build/import DASCore package code exactly as the release tag.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" = "$tag" ]; then
            echo "Already running from latest release tag $tag; leaving dascore/ unchanged."
          else
            git restore --source "$tag" -- dascore
          fi


      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/mamba-install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          environment-file: './.github/doc_environment.yml'
          prepare-test-data: "true"


      - uses: ./.github/actions/build-docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: 'docs/_site'

      - name: Zip doc build
        if: startsWith(github.ref, 'refs/tags/')
        run: zip docs.zip docs/_site -r

      - name: Upload release docs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" docs.zip --clobber

  deploy:
    # Stable docs describe the latest stable release, so a pre-release (eg a
    # beta cut from dev) must not replace them. github.event.release is absent
    # for workflow_dispatch, so manual runs still deploy.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # Needed by actions/deploy-pages.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
