# Build the docs for a release and deploy them: a stable release to
# dascore.org (GitHub Pages), a pre-release to dascore.netlify.app.
name: BuildDeployStableDocs

on:
  # Runs when publishing a new release
  release:
    types: [ published ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Write permissions are granted per job below; the default is read-only.
permissions:
  contents: read

env:
  # Where the test-data cache is restored; pooch reads files from here.
  # Must match the path used in .github/actions/prime-test-data-cache.
  DFS_DATA_DIR: ${{ github.workspace }}/.test_data_cache

# Allow one concurrent GitHub Pages deployment. Only runs which can deploy
# there need to serialize, so they share the "pages" group. A pre-release
# never deploys to Pages; it is grouped per tag so that publishing one
# pre-release cannot cancel another's build before it attaches docs.zip.
concurrency:
  group: >-
    ${{ github.event.release.prerelease
    && format('pages-prerelease-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload docs.zip to the release.
      contents: write
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - name: Classify the release
        id: kind
        env:
          EVENT_NAME: ${{ github.event_name }}
          MARKED_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # GitHub's "Set as a pre-release" box is ticked by hand, so the tag
          # is checked too: anything other than a plain vX.Y.Z (eg v1.0.0b1)
          # is a pre-release even when the box was missed. Otherwise a beta
          # would replace the stable docs. Manual runs are always stable.
          prerelease=false
          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$MARKED_PRERELEASE" = "true" ] \
              || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              prerelease=true
            fi
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release tag '$GITHUB_REF_NAME' is pre-release: $prerelease"
          if [ "$prerelease" = "true" ]; then
            # Pre-release docs live on netlify and are cut from dev, so the
            # tutorial notebooks and "edit this page" links must point there
            # rather than at dascore.org and master, where new pages 404.
            echo "DASCORE_DOC_SITE_URL=https://dascore.netlify.app" >> "$GITHUB_ENV"
            echo "DASCORE_DOC_BRANCH=dev" >> "$GITHUB_ENV"
          fi

      - name: Set manual stable docs version
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Manually set DASCore version based on the last stable tag.
          # Match only final releases: git's version sort places a
          # pre-release (v0.2.0b1) above its final (v0.2.0), so an
          # unfiltered list would publish beta docs as stable.
          tag="$(git tag --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::error::No stable release tag matching vX.Y.Z exists."
            exit 1
          fi
          echo "DASCORE_DOC_VERSION=${tag#v}" >> "$GITHUB_ENV"

          # Keep workflow actions and docs build scripts from this checkout,
          # but build/import DASCore package code exactly as the release tag.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" = "$tag" ]; then
            echo "Already running from latest release tag $tag; leaving dascore/ unchanged."
          else
            # Authored docs now live inside the package; preserve the checkout's
            # docs just as the previous top-level docs/ layout did. The skill
            # files are the text of pages that include them, so keep them too.
            git restore --source "$tag" -- dascore ':(exclude)dascore/docs' ':(exclude)dascore/.agents'
          fi


      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          prepare-test-data: "true"


      - uses: ./.github/actions/build-docs

      - uses: ./.github/actions/report_doc_build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: 'dascore/docs/_site'

      - name: Zip doc build
        if: startsWith(github.ref, 'refs/tags/')
        run: zip docs.zip dascore/docs/_site -r

      - name: Upload release docs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" docs.zip --clobber

      # Netlify holds the docs of the newest pre-release. Builds are grouped
      # per tag, so an older pre-release can finish, or be re-run, after a
      # newer one; it still attaches its docs.zip but must not publish.
      - name: Check no newer release exists
        id: newest
        if: steps.kind.outputs.prerelease == 'true'
        run: |
          # Fetch again: a tag may have been pushed since the checkout.
          git fetch --tags --quiet origin
          newest="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not publishing docs for $GITHUB_REF_NAME to netlify; $newest is newer."
          fi

      # The site was rendered above, so publish it as built rather than
      # rendering again.
      - name: Publish pre-release docs to netlify
        if: steps.newest.outputs.publish == 'true'
        shell: bash
        env:
          QUARTO_PRINT_STACK: true
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          quarto publish dascore/docs --no-render --no-prompt --no-browser

  deploy:
    # Stable docs describe the latest stable release, so a pre-release (eg a
    # beta cut from dev) must not replace them; the build job publishes it to
    # netlify instead. Manual runs are never pre-releases, so they still deploy.
    if: ${{ needs.build.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # Needed by actions/deploy-pages.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
