name: TestDocBuild

on:
  push:
    branches:
      - dev
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  test_build_docs:
    if: |
      github.event_name == 'push'
      || (github.event.action == 'labeled' && github.event.label.name == 'documentation')
      || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'documentation'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to look up the uploaded artifact's id.
      actions: read
      # Needed to create/update the doc link comment on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/mamba-install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          environment-file: './.github/doc_environment.yml'
          cache-number: 1
          prepare-test-data: "true"

      - uses: ./.github/actions/build-docs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: documentation_build_test
          path: ./docs/_site
          retention-days: 1

      - name: Generate documentation URL
        id: artifact_url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="${{ github.run_id }}"
          artifact_name="documentation_build_test"
          repo="${{ github.repository }}"

          artifact_id=$(
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 "https://api.github.com/repos/${repo}/actions/runs/${run_id}/artifacts" |
            jq --arg NAME "$artifact_name" -r '.artifacts[] | select(.name==$NAME) | .id'
          )
          
          if [[ -z "$artifact_id" ]]; then
             echo "❌ Unable to find artefact \"$artifact_name\" for run $run_id" >&2
             exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$repo/actions/runs/$run_id/artifacts/$artifact_id" >> "$GITHUB_OUTPUT"

      # Determine if the automated documentation comment exists.
      - name: Find Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e  # v3.1.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: "✅ Documentation built:"

      # Create a comment with a download link to build docs
      - name: Create or update comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Documentation built:
            👉 [Download](${{ steps.artifact_url.outputs.url }})
            Note: You must be logged in to github and a DASDAE member to access the link.
          edit-mode: replace
