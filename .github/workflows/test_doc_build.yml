name: TestDocBuild

on:
  # Pushes to dev are covered by BuildDeployDevDocs, which builds the same
  # docs and publishes them, so this only guards labeled pull requests.
  pull_request:
    types: [labeled, synchronize]

  # A manual run is how a full build is measured without waiting for a label.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: TestDocBuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Where the test-data cache is restored; pooch reads files from here.
  # Must match the path used in .github/actions/prime-test-data-cache.
  DFS_DATA_DIR: ${{ github.workspace }}/.test_data_cache
  # A pull request builds dev-based content, so the tutorial notebooks should
  # link to the dev docs like BuildDeployDevDocs does. Left unset they would
  # point at the released site, where a page added since the last release 404s
  # and the preview misleads the reviewer.
  DASCORE_DOC_SITE_URL: https://dascore.netlify.app

jobs:
  test_build_docs:
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.state == 'open'
      && ((github.event.action == 'labeled' && github.event.label.name == 'documentation')
      || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'documentation'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to look up the uploaded artifact's id.
      actions: read
      # Needed to create/update the doc link comment on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          prepare-test-data: "true"

      - uses: ./.github/actions/build-docs

      # The artifact this job uploads is the size gate the plan measures
      # against, so this build is the one which pays to compress the site.
      - uses: ./.github/actions/report_doc_build
        with:
          archive: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation_build_test
          path: ./docs/_site
          retention-days: 1

      - name: Generate documentation URL
        id: artifact_url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="${{ github.run_id }}"
          artifact_name="documentation_build_test"
          repo="${{ github.repository }}"

          artifact_id=$(
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 "https://api.github.com/repos/${repo}/actions/runs/${run_id}/artifacts" |
            jq --arg NAME "$artifact_name" -r '.artifacts[] | select(.name==$NAME) | .id'
          )
          
          if [[ -z "$artifact_id" ]]; then
             echo "❌ Unable to find artefact \"$artifact_name\" for run $run_id" >&2
             exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$repo/actions/runs/$run_id/artifacts/$artifact_id" >> "$GITHUB_OUTPUT"

      # Determine if the automated documentation comment exists.
      - name: Find Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: "✅ Documentation built:"

      # Create a comment with a download link to build docs
      - name: Create or update comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Documentation built:
            👉 [Download](${{ steps.artifact_url.outputs.url }})
            Note: You must be logged in to github and a DASDAE member to access the link.
          edit-mode: replace
