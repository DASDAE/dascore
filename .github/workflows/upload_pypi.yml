# Upload to PyPI when a new release tag is made.
name: PublishPackage
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      # Building the sdist and wheel only needs an interpreter and `build`;
      # dascore's own dependencies are irrelevant here, so this no longer
      # solves a conda environment just to reach `python -m build`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: false

      - name: create dists
        shell: bash
        env:
          UV_HTTP_RETRIES: "5"
        run: |
          uv pip install --system build
          python -m build

      # Authenticates via PyPI trusted publishing (OIDC); no token needed.
      - name: publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
