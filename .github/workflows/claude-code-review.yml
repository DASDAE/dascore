name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Forks cannot access secrets, and Claude rejects bot-initiated reviews.
    # Drafts wait until they are marked ready for review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Check Claude credentials
        id: credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude review because credentials are unavailable."
          fi

      - name: Checkout repository
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Load the agent guidelines as CLAUDE.md
        if: steps.credentials.outputs.available == 'true'
        # Claude Code loads CLAUDE.md, not AGENTS.md. A repo-root copy would be
        # deleted by the action, which restores CLAUDE.md from the base branch
        # on PRs, so install the base branch's guidelines as user memory.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch --depth 1 --no-recurse-submodules origin "refs/heads/$BASE_REF"
          mkdir -p ~/.claude
          for f in AGENTS.md .agents/agents.md; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              { echo "# $f"; echo; git show "FETCH_HEAD:$f"; echo; } >> ~/.claude/CLAUDE.md
            fi
          done

      - name: Run Claude Code Review
        if: steps.credentials.outputs.available == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064  # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Your user CLAUDE.md holds this
            repository's agent guidelines, AGENTS.md and .agents/agents.md
            from the base branch. Treat them as the CLAUDE.md rules for
            compliance checks, and give them to any agent that checks
            compliance. When a comment cites a guideline, link the repository
            file, not CLAUDE.md."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
