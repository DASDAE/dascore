# This action renders the docs of the branch it is run from and publishes
# them to dascore.netlify.app.
#
# That site holds the docs of the latest pre-release, which
# BuildDeployStableDocs publishes when one is released, so this no longer
# runs on every push to dev: a push would replace the pre-release's docs
# with those of unreleased code. It remains as a manual way to publish a
# docs fix between pre-releases.

name: BuildDeployDevDocs

on:
  # Run manually from the Actions tab
  workflow_dispatch:

# The docs publish to netlify with its own token, so the GITHUB_TOKEN only
# needs to read the repo.
permissions:
  contents: read

env:
  # Where the test-data cache is restored; pooch reads files from here.
  # Must match the path used in .github/actions/prime-test-data-cache.
  DFS_DATA_DIR: ${{ github.workspace }}/.test_data_cache
  # The branch quarto uses for the docs' "edit this page" links. Taken from the
  # ref rather than hard-coded so a manual run of another branch still links to
  # the branch it published.
  DASCORE_DOC_BRANCH: ${{ github.ref_name }}
  # These docs publish to netlify rather than dascore.org, and the tutorial
  # notebooks link back to the site they were built for. Left unset, they would
  # point at the released docs, where any page added since the last release
  # 404s.
  DASCORE_DOC_SITE_URL: https://dascore.netlify.app

# Publish only the newest run. This is a netlify deployment, so it does
# not share the "pages" group used by the stable docs; grouping them together
# would let a run here cancel a release's GitHub Pages deployment.
concurrency:
  group: "netlify-dev-docs"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          prepare-test-data: "true"

      - uses: ./.github/actions/prep_doc_build

      - name: publish docs to netlify
        shell: bash
        env:
          QUARTO_PRINT_STACK: true
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
            python scripts/_doc_report.py time quarto_publish -- \
              quarto publish dascore/docs --no-prompt --no-browser

      - uses: ./.github/actions/report_doc_build
