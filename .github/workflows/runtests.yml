# Run full test suite using conda env and all optional deps.
name: TestCode
on:
  push:
    branches:
    - master
    - dev
  pull_request:
    branches:
    - master
    - dev
    paths:
      - 'pyproject.toml'
      - '**.py'
      - '.github/workflows/*.yml'
      - '.github/actions/**/*.yml'
      # Registry edits change the test-data cache key; run the suite so the
      # prime script validates new entries before merge.
      - 'dascore/data_registry.txt'

permissions:
  contents: read

env:
  # Where the test-data cache is restored; pooch reads files from here.
  # Must match the path used in .github/actions/prime-test-data-cache.
  DFS_DATA_DIR: ${{ github.workspace }}/.test_data_cache
  # Ensure matplotlib doesn't try to show figures in CI
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

# Cancel previous runs when this one starts.
concurrency:
  group: TestCode-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Load Python version matrix from shared vars
  setup:
    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')
    runs-on: ubuntu-latest
    outputs:
      # Shared values live in .github/actions/load-shared-vars/action.yml
      python-matrix: ${{ steps.load-vars.outputs.python-test-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-shared-vars
        id: load-vars
      # Make sure the shared cross-OS test-data cache exists before the matrix
      # jobs start, so at most one job builds it. On a simultaneous cold miss
      # the other test workflow's setup job may benignly race-prime the same
      # key; the losing save just logs a warning.
      - uses: ./.github/actions/prime-test-data-cache
        with:
          lookup-only: "true"

  test_code:
    needs: setup
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Defined in .github/actions/load-shared-vars/action.yml
        python-version: ${{ fromJson(needs.setup.outputs.python-matrix) }}

    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    env:
      # set conda environment file with dependencies
      env_file: 'environment.yml'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: 'true'
          fetch-depth: '0'

      - uses: ./.github/actions/mamba-install-dascore
        with:
          python-version: ${{ matrix.python-version }}
          prepare-test-data: "true"

      # Runs test suite and calculates coverage
      - name: run test suite
        shell: bash -el {0}
        run: ./.github/test_code.sh

      # Runs examples in docstrings
      - name: test docstrings
        shell: bash -el {0}
        run: ./.github/test_code.sh doctest

      # Upload coverage files
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: unittests
          name: PR_tests
          token: ${{ secrets.CODECOV_TOKEN }}
      
            
