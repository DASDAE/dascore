# Run full test suite using conda env and all optional deps.
name: TestCode
on:
  push:
    branches:
    - master
    - dev
  pull_request:
    branches:
    - master
    - dev
    paths:
      - 'pyproject.toml'
      - 'docs/**/*.qmd'
      - '**.py'
      - '.github/workflows/*.yml'
      - '.github/actions/**/*.yml'

env:
  # used to manually trigger cache reset. Just increment if needed.
  CACHE_NUMBER: 1
  # Ensure matplotlib doesn't try to show figures in CI
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

# Cancel previous runs when this one starts.
concurrency:
  group: TestCode-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Load Python version matrix from shared vars
  setup:
    runs-on: ubuntu-latest
    outputs:
      # Shared values live in .github/actions/load-shared-vars/action.yml
      python-default: ${{ steps.load-vars.outputs.python-default }}
      python-matrix: ${{ steps.load-vars.outputs.python-test-matrix }}
      os-matrix: ${{ steps.load-vars.outputs.test-os-matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-shared-vars
        id: load-vars

  test_code:
    name: ${{ matrix.name || format('test_code ({0}, Python {1})', matrix.os, matrix.python-version) }}
    needs: setup
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Defined in .github/actions/load-shared-vars/action.yml
        os: ${{ fromJson(needs.setup.outputs.os-matrix) }}
        # Defined in .github/actions/load-shared-vars/action.yml
        python-version: ${{ fromJson(needs.setup.outputs.python-matrix) }}
        free_thread: [false]
        test_shell: ["bash -el {0}"]
        include:
          - os: ubuntu-latest
            python-version: "3.14t"
            free_thread: true
            name: free_thread
            test_shell: "env PYTHON_GIL=0 bash --noprofile --norc -e -o pipefail {0}"

    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    env:
      # set conda environment file with dependencies
      env_file: 'environment.yml'
      debug_enabled: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'debug') }}
      PYTEST_ADDOPTS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'debug') && '-vv --durations=100' || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          fetch-depth: '0'

      - uses: ./.github/actions/mamba-install-dascore
        if: ${{ !matrix.free_thread }}
        with:
          python-version: ${{ matrix.python-version }}
          cache-number: ${{ env.CACHE_NUMBER }}
          prepare-test-data: "true"

      - name: set up free-threaded Python
        if: matrix.free_thread
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install free-threaded test dependencies
        if: matrix.free_thread
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,docs]" findiff

      - name: verify free-threaded runtime
        if: matrix.free_thread
        shell: bash
        run: |
          python -c 'import dascore, sys, sysconfig; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled()'

      - name: export free-threaded test data cache env
        if: matrix.free_thread
        shell: bash
        env:
          INPUT_CACHE_NUMBER: ${{ env.CACHE_NUMBER }}
          RUNNER_OS: ${{ runner.os }}
        run: python .github/scripts/export_test_data_cache_env.py >> "$GITHUB_ENV"

      - name: restore free-threaded test data cache
        if: matrix.free_thread
        id: restore-free-thread-test-data
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_CACHE_PATH }}
          key: ${{ env.DATA_CACHE_KEY }}

      - name: prime free-threaded test data cache
        if: matrix.free_thread && steps.restore-free-thread-test-data.outputs.cache-hit != 'true'
        shell: bash
        run: python .github/scripts/cache_test_data.py

      - name: save free-threaded test data cache
        if: matrix.free_thread && steps.restore-free-thread-test-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DATA_CACHE_PATH }}
          key: ${{ env.DATA_CACHE_KEY }}

      - name: generate qmd docs tests
        id: generate_qmd_tests
        shell: ${{ matrix.test_shell }}
        run: python scripts/generate_doc_code_tests.py

      # Runs test suite and calculates coverage
      - name: run test suite
        id: run_test_suite
        continue-on-error: ${{ env.debug_enabled == 'true' }}
        shell: ${{ matrix.test_shell }}
        run: ./.github/test_code.sh

      # Runs examples in docstrings
      - name: test docstrings
        id: run_docstrings
        continue-on-error: ${{ env.debug_enabled == 'true' }}
        shell: ${{ matrix.test_shell }}
        run: ./.github/test_code.sh doctest

      - name: note SSH key requirement for debug access
        if: env.debug_enabled == 'true' && (steps.run_test_suite.outcome == 'failure' || steps.run_docstrings.outcome == 'failure')
        shell: bash
        run: |
          message="Debug access is limited to the workflow actor's GitHub SSH keys. Connect from a machine that has the matching private key loaded."
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup tmate session
        if: env.debug_enabled == 'true' && (steps.run_test_suite.outcome == 'failure' || steps.run_docstrings.outcome == 'failure')
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

      # Upload coverage files
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: unittests
          name: PR_tests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: fail job after debug session if tests failed
        if: steps.generate_qmd_tests.outcome == 'failure' || steps.run_test_suite.outcome == 'failure' || steps.run_docstrings.outcome == 'failure'
        shell: bash
        run: exit 1

  network_tests:
    needs: setup
    timeout-minutes: 60
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    # Keep remote-IO coverage visible without blocking unrelated changes.
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    env:
      env_file: 'environment.yml'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          fetch-depth: '0'
          persist-credentials: false

      - uses: ./.github/actions/mamba-install-dascore
        with:
          python-version: ${{ needs.setup.outputs.python-default }}
          cache-number: ${{ env.CACHE_NUMBER }}
          prepare-test-data: "true"

      - name: run network tests
        shell: bash -el {0}
        run: ./.github/test_code.sh network

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: network
          name: PR_network_tests_${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: summarize non-gating failure
        if: failure()
        shell: bash
        run: echo "Network tests failed, but this report-only job does not block the workflow." >> "$GITHUB_STEP_SUMMARY"
