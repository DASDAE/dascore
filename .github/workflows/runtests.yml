# Run full test suite with all optional deps. Dependency caching is off: the
# mamba caches it replaced ate 7 of the repo's 10 GB. See #860 to re-enable.
name: TestCode
on:
  push:
    branches:
    - master
    - dev
  pull_request:
    branches:
    - master
    - dev
    paths:
      - 'pyproject.toml'
      # The conda_env job exists to guard this file, so it has to run when
      # the file changes.
      - 'environment.yml'
      - 'docs/**/*.qmd'
      - '**.py'
      - '.github/workflows/*.yml'
      - '.github/actions/**/*.yml'
      # Registry edits change the test-data cache key; run the suite so the
      # prime script validates new entries before merge.
      - 'dascore/data_registry.txt'

permissions:
  contents: read

env:
  # Where the test-data cache is restored; pooch reads files from here.
  # Must match the path used in .github/actions/prime-test-data-cache.
  DFS_DATA_DIR: ${{ github.workspace }}/.test_data_cache
  # Ensure matplotlib doesn't try to show figures in CI
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

# Supersede the previous run: by pull request, or by branch for pushes.
concurrency:
  group: TestCode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Load Python version matrix from shared vars
  setup:
    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')
    runs-on: ubuntu-latest
    outputs:
      # Shared values live in .github/actions/load-shared-vars/action.yml
      python-default: ${{ steps.load-vars.outputs.python-default }}
      test-matrix: ${{ steps.load-vars.outputs.test-matrix }}
      network-os-matrix: ${{ steps.load-vars.outputs.network-os-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-shared-vars
        id: load-vars
      # Make sure the shared cross-OS test-data cache exists before the matrix
      # jobs start, so at most one job builds it. On a simultaneous cold miss
      # the other test workflow's setup job may benignly race-prime the same
      # key; the losing save just logs a warning.
      - uses: ./.github/actions/prime-test-data-cache
        with:
          lookup-only: "true"

  test_code:
    needs: setup
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      # One job failing used to cancel the rest, which both hid the other
      # results and wasted the work those jobs had already done.
      fail-fast: false
      # Defined in .github/actions/load-shared-vars/action.yml
      matrix: ${{ fromJson(needs.setup.outputs.test-matrix) }}

    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    env:
      debug_enabled: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'debug') }}
      PYTEST_ADDOPTS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'debug') && '-vv --durations=100' || '' }}
      # One data file per cell; the coverage_gate job combines them all.
      COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: 'true'
          fetch-depth: '0'
          persist-credentials: false

      - uses: ./.github/actions/install-dascore
        with:
          python-version: ${{ matrix.python-version }}
          prepare-test-data: "true"

      # The generated docs tests and the doctests are the same on every cell
      # and cost minutes, so one cell runs each. The generated tests run
      # inside the measured suite below, so their coverage reaches the gate;
      # the doctests are not measured, and counting them would let a line
      # reachable only from a docstring example satisfy the gate.
      - name: generate qmd docs tests
        id: generate_qmd_tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == needs.setup.outputs.python-default
        shell: bash
        run: python scripts/generate_doc_code_tests.py

      # Runs test suite and calculates coverage
      - name: run test suite
        id: run_test_suite
        continue-on-error: ${{ env.debug_enabled == 'true' }}
        # bash, not the windows default shell: test_code.sh is a bash script.
        shell: bash
        run: ./.github/test_code.sh

      # Runs examples in docstrings
      - name: test docstrings
        id: run_docstrings
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == needs.setup.outputs.python-default
        continue-on-error: ${{ env.debug_enabled == 'true' }}
        shell: bash
        run: ./.github/test_code.sh doctest

      - name: note SSH key requirement for debug access
        if: env.debug_enabled == 'true' && (steps.run_test_suite.outcome == 'failure' || steps.run_docstrings.outcome == 'failure')
        shell: bash
        run: |
          message="Debug access is limited to the workflow actor's GitHub SSH keys. Connect from a machine that has the matching private key loaded."
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup tmate session
        if: env.debug_enabled == 'true' && (steps.run_test_suite.outcome == 'failure' || steps.run_docstrings.outcome == 'failure')
        uses: mxschmitt/action-tmate@f309efdef7da88e388f96a3cafc4f181ac639f7a  # v3.9
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

      # The cell's coverage data, for the coverage_gate job to combine.
      # Uploaded even when the tests failed, so a partial report is still
      # readable; the gate then fails on the missing lines rather than on a
      # missing artifact.
      - name: upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          # A coverage data file starts with a dot.
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

      - name: fail job after debug session if tests failed
        if: steps.generate_qmd_tests.outcome == 'failure' || steps.run_test_suite.outcome == 'failure' || steps.run_docstrings.outcome == 'failure'
        shell: bash
        run: exit 1

  # Where the 100% coverage threshold is enforced. It has to run on the
  # combined data rather than in any one cell: a handful of lines are
  # reachable only on a case-insensitive filesystem (macOS, Windows), and
  # the generated docs tests run on one cell.
  coverage_gate:
    needs: [setup, test_code]
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # Report on whatever the cells produced, including when one of them
    # failed; do not wait on network_tests, which is allowed to fail.
    if: ${{ !cancelled() && (github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Coverage alone: this job reads the source tree, it does not import
      # dascore, so the dependency install is not worth its minute.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ needs.setup.outputs.python-default }}

      - name: install coverage
        shell: bash
        run: python -m pip install "coverage>=7.4,<8"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: coverage-*
          merge-multiple: true

      # [tool.coverage.paths] in pyproject.toml is what lets the three
      # operating systems' data files combine into one set of files.
      - name: combine coverage
        shell: bash
        run: |
          coverage combine
          coverage report --show-missing
          coverage xml

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        if: ${{ !cancelled() }}
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: combined_tests
          token: ${{ secrets.CODECOV_TOKEN }}

      # Last, so the report is uploaded whether or not this passes.
      - name: require full coverage
        shell: bash
        run: coverage report --fail-under=100

  network_tests:
    needs: setup
    timeout-minutes: 60
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Defined in .github/actions/load-shared-vars/action.yml
        os: ${{ fromJson(needs.setup.outputs.network-os-matrix) }}

    # Keep remote-IO coverage visible without blocking unrelated changes.
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    env:
      COVERAGE_FILE: .coverage.network-${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: 'true'
          fetch-depth: '0'
          persist-credentials: false

      - uses: ./.github/actions/install-dascore
        with:
          python-version: ${{ needs.setup.outputs.python-default }}
          prepare-test-data: "true"

      - name: run network tests
        shell: bash
        run: ./.github/test_code.sh network

      # One network report per run, from one OS: the codecov comment waits
      # for a fixed number of uploads (codecov.yml), and the three operating
      # systems exercise the same remote code.
      # !cancelled(), not the implicit success(): the tests here are allowed
      # to fail, and skipping the xml would leave codecov waiting forever for
      # the second of the two uploads it counts.
      - name: write coverage xml
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        shell: bash
        run: coverage xml

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: network
          name: PR_network_tests_${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: summarize non-gating failure
        if: failure()
        shell: bash
        run: echo "Network tests failed, but this report-only job does not block the workflow." >> "$GITHUB_STEP_SUMMARY"

  # The only remaining conda job. DASCore ships on conda-forge, so the conda
  # dependency stack deserves a smoke test even though every other job now
  # installs from PyPI with uv. One (os, python) keeps this to a single
  # environment cache per week rather than the ~15 the full matrix used to
  # mint; see the cache note at the top of this file.
  conda_env:
    needs: setup
    timeout-minutes: 45
    runs-on: ubuntu-latest

    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: 'true'
          fetch-depth: '0'
          persist-credentials: false

      - uses: ./.github/actions/mamba-install-dascore
        with:
          python-version: ${{ needs.setup.outputs.python-default }}
          # Installed below with --no-deps instead: letting pip resolve the
          # dependencies would layer PyPI distributions over the conda
          # environment and so hide whatever environment.yml is missing.
          install-package: "false"
          prepare-test-data: "true"

      - name: install dascore on the conda environment alone
        shell: bash -el {0}
        run: |
          pip install --no-deps -e .
          pip check

      # A smoke test, not the suite: every test already runs on the uv
      # matrix, and what this job answers is whether environment.yml still
      # solves and dascore reads a file in the environment it describes.
      - name: run a subset of the test suite
        shell: bash -el {0}
        run: python -m pytest tests/test_io/test_dasdae tests/test_compat.py -q
