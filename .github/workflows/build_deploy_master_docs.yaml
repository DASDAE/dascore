# This action renders and publishes the development docs whenever
# new commits are added to the master bracnh.

name: BuildDeployDevDocs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The docs publish to netlify with its own token, so the GITHUB_TOKEN only
# needs to read the repo.
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/mamba-install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          environment-file: './.github/doc_environment.yml'
          prepare-test-data: "true"

      - uses: ./.github/actions/prep_doc_build

      - name: publish docs to netlify
        shell: bash -l {0}
        env:
          QUARTO_PRINT_STACK: true
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
            quarto publish docs --no-prompt --no-browser
