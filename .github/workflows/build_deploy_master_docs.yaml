# This action renders and publishes the development docs whenever
# new commits are added to the master branch.

name: BuildDeployMasterDocs

on:
  # Runs on pushes targeting the master branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The docs publish to netlify with its own token, so the GITHUB_TOKEN only
# needs to read the repo.
permissions:
  contents: read

env:
  # Where the test-data cache is restored; pooch reads files from here.
  # Must match the path used in .github/actions/prime-test-data-cache.
  DFS_DATA_DIR: ${{ github.workspace }}/.test_data_cache

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          prepare-test-data: "true"

      - uses: ./.github/actions/build-docs

      - name: publish docs to netlify
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
            # The site id previously lived in docs/_publish.yml, which
            # `quarto publish` read; great-docs emits a plain directory, so
            # deploy it with netlify's own CLI instead.
            npx --yes netlify-cli@23 deploy \
              --prod --no-build \
              --dir great-docs/_site \
              --site da79b12f-cb25-4fcc-aeb6-f19705848130
