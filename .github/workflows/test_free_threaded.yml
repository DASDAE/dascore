# Run the test suite on a free-threaded (no-GIL) CPython build.
name: TestFreeThreaded
on:
  push:
    branches:
      - master
      - dev
      - xarray_integration
  pull_request:
    branches:
      - master
      - dev
      - xarray_integration
    paths:
      - 'dascore/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test_free_threaded.yml'
      - '.github/scripts/**'
      - '.github/actions/**/*.yml'

# This job only reads the repository.
permissions:
  contents: read

# Supersede the previous run: by pull request, or by branch for pushes.
concurrency:
  group: TestFreeThreaded-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen
  # Where the test-data cache is restored; pooch reads files from here.
  # Must match the path used in .github/actions/prime-test-data-cache.
  DFS_DATA_DIR: ${{ github.workspace }}/.test_data_cache
  # Keep the GIL off even if an extension module asks for it back, so a
  # dependency cannot quietly turn this job into an ordinary one.
  PYTHON_GIL: '0'

jobs:
  free_thread:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # only run if CI isn't turned off
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'no_ci')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: 'true'
          fetch-depth: '0'
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14t'

      # Only the core dependencies: the optional ones are not all built for
      # free-threading yet, and their tests skip when they are missing.
      - name: install dascore
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-timeout pytest-xdist

      - name: confirm the GIL is disabled
        run: |
          python -c "
          import sys
          print(sys.version)
          assert not sys._is_gil_enabled(), 'the GIL is enabled; this job proves nothing'
          "

      - name: prepare test data cache
        uses: ./.github/actions/prime-test-data-cache

      - name: run test suite without the GIL
        run: python -m pytest tests -m "not network" -q --timeout=900 -n logical --dist loadfile
