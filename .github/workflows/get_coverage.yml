# Calculates new coverage for the base branch and uploads to codecov
name: Coverage
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  calc_coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-tags: "true"
          fetch-depth: '0'

      - uses: ./.github/actions/load-shared-vars
        id: shared-vars

      - uses: ./.github/actions/mamba-install-dascore
        with:
          # Defined in .github/actions/load-shared-vars/action.yml
          python-version: ${{ steps.shared-vars.outputs.python-default }}
          cache-number: 1
          prepare-test-data: "true"

      - name: run test suite
        shell: bash -l {0}
        run: |
          pytest -s --cov dascore --cov-report=xml

      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests # optional
          name: master_tests # optional
          token: ${{ secrets.CODECOV_TOKEN }} # required
