name: "Mamba Install"
description: >
  Sets up mamba before installing DASCore's environment.yml file. Only the
  conda_env smoke job in runtests.yml uses this; everything else installs
  from PyPI via .github/actions/install-dascore.
inputs:
  python-version:
    description: "The python string of the version to install"
    required: true

  environment-file:
    description: "The path to the environment file to use."
    required: false
    default: "environment.yml"

  install-group-str:
    description: "The string to use for specifying install groups"
    default: "[dev]"
    required: false

  install-package:
    description: "If true, install dascore"
    default: "true"
    required: false

  prepare-test-data:
    description: "If true, restore, prime, and save the test-data cache after installation"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Weekly, not daily. The env file's content hash is already part of the
    # key setup-micromamba builds, so this only exists to pick up upstream
    # package updates for unpinned deps. A daily key minted a fresh cache per
    # (platform, python, env file) every day; even weekly, when the whole
    # matrix ran on mamba, these caches filled 7 GB of the repo's 10 GB
    # budget and evicted the test-data caches. With a single caller left this
    # is one ~530 MB cache per week.
    - name: Set up cache week for environment cache key
      id: date
      shell: bash
      # %G, not %Y: ISO week numbers pair with the ISO year, so %Y-W%V
      # collides across a new year boundary.
      run: echo "cache-week=$(date '+%G-W%V')" >> "$GITHUB_OUTPUT"

    - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
      with:
        micromamba-version: '2.0.5-0' # versions: https://github.com/mamba-org/micromamba-releases
        environment-file: ${{ inputs.environment-file }}
        init-shell: >-
          bash
          powershell
        cache-environment: true
        cache-environment-key: environment-${{ steps.date.outputs.cache-week }}-${{ inputs.environment-file }}
        post-cleanup: "shell-init"
        # python-gil pins the GIL-enabled build. Without it the solver can
        # pick the free-threaded (cp3XXt) build of python, which is not what
        # this job means to test and which lacks wheels for some deps.
        # Free-threading is covered separately by test_free_threaded.yml.
        create-args: >-
          python=${{ inputs.python-version }}
          python-gil

    # Not sure why this is needed but it appears to be the case
    - name: fix env
      shell: bash -l {0}
      run: |
        micromamba shell init --shell bash --root-prefix=~/micromamba
        eval "$(micromamba shell hook --shell bash)"
        micromamba activate dascore

    - name: print python version
      shell: bash -el {0}
      run: |
        python --version

    - name: get tags for correct versioning
      shell: bash -el {0}
      run: |
        git fetch --tags --force

    - name: install dascore
      if: "${{ inputs.install-package == 'true' }}"
      shell: bash -l {0}
      env:
        INSTALL_GROUP_STR: ${{ inputs.install-group-str }}
      run: |
        pip install -e ".${INSTALL_GROUP_STR}"

    # Normally just restores the cache primed by the calling workflow's setup
    # job, but also self-heals (prime + save) on a miss, e.g. for single-job
    # workflows or when a re-run can't see an evicted cache.
    - name: prepare test data cache
      if: "${{ inputs.prepare-test-data == 'true' }}"
      uses: ./.github/actions/prime-test-data-cache

    # Print out the package info for current environment
    - name: print package info
      shell: bash -el {0}
      run: |
        micromamba info
        micromamba list
