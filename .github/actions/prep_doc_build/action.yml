name: "prepare for doc build"
description: "Installs quarto, renders api docs, prints quarto version"

runs:
  using: "composite"
  steps:
    - name: Install quarto
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
      with:
        # website.announcement (the site-wide banner) needs quarto >= 1.5;
        # this matches the version the dev branch builds with.
        version: 1.8.27
        tinytex: true

    - name: print quarto version
      shell: bash -l {0}
      run: |
        quarto --version

    - name: render API docs
      shell: bash -l {0}
      run: |
        python scripts/build_api_docs.py
